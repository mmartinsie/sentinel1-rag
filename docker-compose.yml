# Local Postgres + pgvector for the RAG index.
# Credentials are local-only defaults; override them in a .env file if needed.
name: sentinel1-rag

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      # Bound to localhost only: the database is not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep PGDATA in /var/lib/postgresql/18/docker,
      # so the volume goes on /var/lib/postgresql (not on .../data).
      - pgdata:/var/lib/postgresql
      # Runs only when the data volume is empty (first start or after `make clean`).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      # Check over TCP: during init the temporary server only listens on the Unix
      # socket, so this passes once the schema is applied and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # OpenSearch with its k-NN plugin, to compare with pgvector (D-034). Only started by
  # `make opensearch-up` (the "opensearch" profile), so `make up` stays light.
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    profiles: ["opensearch"]
    environment:
      discovery.type: single-node
      # Local development only: no TLS, no users. The port below is bound to localhost.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # A fixed 1 GB heap: Gemma, bge-m3 and Postgres share WSL's 12 GB with it.
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=2s >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  pgdata:
  osdata:
