# Agent eval questions (D-029).
#
# `make eval-agent` asks the agent each question and checks what it did, not the scenes it
# found: the catalogue grows every day, but the right tool calls for a question stay the same.
# `today` fixes the date the model takes as today, so "last week" has a single right answer.
#
# For each question:
# - `tools`: the tools the agent should call, no more and no fewer.
# - `scenes`: what a search_scenes call should have searched. `point` is a [latitude, longitude]
#   that the place found must contain. The other keys are compared with the arguments after
#   the tool fills in its defaults (product_type GRD); a list gives the values accepted, and
#   null means the filter must be left out, because the question does not ask for it.
# - `labels_from`: an id in questions.yaml. Its labelled sections are the right answer, and one
#   of them should be among the passages the agent read.
# - `answerable: false`: the documentation does not answer the question, so the answer must not
#   cite any passage.
#
# `set` records how each question was used:
# - `tuning`: questions whose failures shaped the prompt and the tools, so they measure the fixes
#   as much as the agent. The first five come from the probe run before any code was written.
#   The next seven were held out in the first run (eval/results/2026-10-11T130859-agent-first-design.json),
#   where they passed 2 of 7, and their failures were then used for the fixes.
# - `held-out`: the last six, written after that first run and before any fix, and never used to
#   change the prompt or the tools.
# All the questions were drafted by Claude; none was written blind.

today: 2026-10-11  # a Sunday

questions:
  - id: scenes-madrid-week
    set: tuning
    lang: es
    question: ¿Hay imágenes Sentinel-1 GRD de Madrid de la última semana?
    tools: [search_scenes]
    scenes:
      point: [40.4168, -3.7038]
      product_type: GRD
      start: [2026-10-04, 2026-10-05]
      end: [2026-10-10, 2026-10-11]
      mode: null
      orbit: null

  - id: scenes-donana-slc
