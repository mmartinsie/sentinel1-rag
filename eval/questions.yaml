  - id: ground-subsidence
    written: from-text
    lang: es
    question: ¿Cómo puede Sentinel-1 medir hundimientos del terreno de pocos milímetros al año?
    # Interferometry explains the technique (DInSAR, PSI); Urban Deformation Mapping gives the
    # millimetre accuracy.
    relevant:
      - section: S1 Mission > SAR Instrument > Interferometry
        url: https://sentiwiki.copernicus.eu/web/s1-mission#Interferometry
      - section: S1 Applications > Land Monitoring > Urban Deformation Mapping
        url: https://sentiwiki.copernicus.eu/web/s1-applications#Urban-Deformation-Mapping

  - id: product-slicing
    written: from-text
    lang: es
    question: ¿Por qué los productos de nivel 1 se cortan en slices y cómo se vuelven a ensamblar?
    relevant:
      - section: S1 Processing > Product Slicing Handling
        url: https://sentiwiki.copernicus.eu/web/s1-processing#Product-Slicing-Handling

# Written blind but not scored:
# - "¿Cómo se exportan los resultados a GeoTIFF?": no page explains exporting; they only say
#   that Level-1 measurement files are GeoTIFF. A good "not found" test for `make ask`.
# - "¿Qué diferencias existen entre los productos SLC y GRD?": the same question as grd-vs-slc.
# - "¿Qué diferencias hay entre los productos Level-0, Level-1 y Level-2?": each level has its
#   own section, and a single search did not bring all three into reach (Level-0 at rank 2,
#   Level-1 at 3, Level-2 at 14), so part of the answer is always lost. It counted as a hit
#   anyway, because one section was enough for hit@k. Questions about three or more things
#   are left out of the eval for that reason.
