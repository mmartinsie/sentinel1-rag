        url: https://sentiwiki.copernicus.eu/web/s1-mission#Orbit
      - section: S1 Mission > Overview of Sentinel-1 Mission > Geographical Coverage
        url: https://sentiwiki.copernicus.eu/web/s1-mission#Geographical-Coverage

  - id: iw-swath-resolution
