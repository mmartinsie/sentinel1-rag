  - id: orbit-files
    written: from-text
    lang: es
    question: ¿Qué tipos de ficheros de órbita hay para Sentinel-1 y en qué se diferencian en latencia y precisión?
    # The latency and accuracy figures are in Products Description; the POD Service section
    # names the four orbit products and their timeliness classes (NRT, STC, NTC), without figures.
    relevant:
      - section: S1 Processing > POD Sentinel-1 Products Specification > Products Description
        url: https://sentiwiki.copernicus.eu/web/s1-processing#Products-Description
      - section: S1 Mission > Precise Orbit Determination Service
        url: https://sentiwiki.copernicus.eu/web/s1-mission#Precise-Orbit-Determination-Service

  - id: level2-ocean
    written: from-text
    lang: en
    question: Which geophysical measurements does the Level-2 ocean product provide?
    # "S1 Products > SAR Products Overview" only names the components by their acronyms.
    relevant:
      - section: S1 Products > Level-2 Products
        url: https://sentiwiki.copernicus.eu/web/s1-products#Level-2-Products
