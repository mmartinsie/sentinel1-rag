# Retrieval eval questions.
#
# Each question lists the sections that answer it. `url` is the citation URL that retrieval
# returns for the section (page URL + "#" + heading anchor) and is what the eval matches on;
# `section` is the readable heading path. `make eval` checks that both exist in the index, so a
# typo fails loudly instead of counting as a miss. A question counts as found at rank r when
# the r-th retrieved chunk comes from one of its sections.
#
# Labelling rule (strict): a section is listed only if, read on its own, it answers the main
# part of the question. Sections that only name the topic are left out. For a question that
# compares two things (GRD vs SLC), each section that explains one of them counts, because no
# single section explains both. Questions about three or more things are not used (see the end).
#
# `written` records how the question was written:
# - blind: by someone who had not read the pages, the way a user would ask;
# - from-text: drafted after reading the section that answers it, so it may share its wording.
#
# `lang` is the language of the question (es or en). The pages are in English, so lexical
# search can only match a Spanish question through the words both languages share, such as
# acronyms (D-019).

questions:
  - id: grd-vs-slc
    written: blind
    lang: es
    question: ¿Qué diferencia hay entre un producto GRD y uno SLC?
    # "S1 Products > Level-1 Products" lists both product types and their resolutions, but
    # only these two sections explain the difference (phase kept or lost, slant or ground range).
    relevant:
      - section: S1 Processing > L1 Algorithms > Single Look Complex (SLC)
        url: https://sentiwiki.copernicus.eu/web/s1-processing#Single-Look-Complex-(SLC)
      - section: S1 Processing > L1 Algorithms > Ground Range Detected (GRD)
        url: https://sentiwiki.copernicus.eu/web/s1-processing#Ground-Range-Detected-(GRD)

  - id: sar-principle
    written: blind
    lang: es
    question: ¿Cómo funciona el sensor SAR de Sentinel-1?
    # Three angles on the same question: the physics of the measurement, how the long antenna
    # is synthesised, and the instrument's signal chain.
    relevant:
      - section: S1 Mission > SAR Instrument > Geophysical Measurements
        url: https://sentiwiki.copernicus.eu/web/s1-mission#Geophysical-Measurements
      - section: S1 Products > SAR Products Overview
        url: https://sentiwiki.copernicus.eu/web/s1-products#SAR-Products-Overview
      - section: S1 Mission > SAR Instrument
        url: https://sentiwiki.copernicus.eu/web/s1-mission#SAR-Instrument

  - id: product-metadata
    written: blind
    lang: es
    question: ¿Qué metadatos contiene un producto Sentinel-1 y cómo se consultan?
    # Only half of it is answerable: the section describes the SAFE folder (an XML manifest
    # with the general metadata, plus annotation subfolders), but no page explains how to query it.
    relevant:
      - section: S1 Products > SAR Products Overview > SAR Naming Convention
        url: https://sentiwiki.copernicus.eu/web/s1-products#SAR-Naming-Convention

  - id: grd-content
    written: blind
    lang: es
    question: ¿Qué información contiene un producto Sentinel-1 GRD?
    relevant:
      - section: S1 Processing > L1 Algorithms > Ground Range Detected (GRD)
        url: https://sentiwiki.copernicus.eu/web/s1-processing#Ground-Range-Detected-(GRD)
      - section: S1 Products > Level-1 Products
        url: https://sentiwiki.copernicus.eu/web/s1-products#Level-1-Products
      - section: S1 Products > SAR Products Overview > Level-1 Products Formatting
        url: https://sentiwiki.copernicus.eu/web/s1-products#Level-1-Products-Formatting

  - id: slc-content
    written: blind
    lang: es
    question: ¿Qué información contiene un producto Sentinel-1 SLC?
    # "S1 Products > Level-1 Products" has one SLC row per mode in a resolution table, and
    # "Interferometric Wide Swath" describes IW SLC products only, so neither is listed.
    relevant:
      - section: S1 Processing > L1 Algorithms > Single Look Complex (SLC)
        url: https://sentiwiki.copernicus.eu/web/s1-processing#Single-Look-Complex-(SLC)
      - section: S1 Products > SAR Products Overview > Level-1 Products Formatting
        url: https://sentiwiki.copernicus.eu/web/s1-products#Level-1-Products-Formatting

  - id: repeat-cycle
    written: from-text
    lang: en
    question: What is the repeat cycle of Sentinel-1, and how does a second satellite change it?
    relevant:
