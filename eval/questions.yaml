# Retrieval eval questions.
#
# Each question lists the sections that answer it. `url` is the citation URL that retrieval
# returns for the section (page URL + "#" + heading anchor, or for a PDF its URL + "#page=N",
# the page where the section starts) and is what the eval matches on; `section` is the
# readable heading path. `make eval` checks that both exist in the index, so a
# typo fails loudly instead of counting as a miss. A question counts as found at rank r when
# the r-th retrieved chunk comes from one of its sections.
#
# Labelling rule (strict): a section is listed only if, read on its own, it answers the main
# part of the question. Sections that only name the topic are left out. For a question that
# compares two things (GRD vs SLC), each section that explains one of them counts, because no
# single section explains both. Questions about three or more things are not used (see the end).
#
# `written` records how the question was written:
# - blind: by someone who had not read the pages, the way a user would ask;
# - from-text: drafted after reading the section that answers it, so it may share its wording.
#
# `lang` is the language of the question (es or en). The pages are in English, so lexical
# search can only match a Spanish question through the words both languages share, such as
# acronyms (D-019).
#
# Step 12 added six technical PDFs to the corpus (D-024). Every question written before was
# checked against them with the same rule, and 11 of the 19 gained PDF sections. The questions
# after product-slicing were written for the PDFs.

questions:
  - id: grd-vs-slc
    written: blind
    lang: es
    question: ¿Qué diferencia hay entre un producto GRD y uno SLC?
    # "S1 Products > Level-1 Products" lists both product types and their resolutions, but
    # only the two L1 Algorithms sections explain the difference (phase kept or lost, slant or
    # ground range). In the Product Definition, 5.2 sets the two types side by side in a table
    # (complex or detected, slant or ground range), and 5.2.1 and 5.2.2 explain one each;
    # 5.1 only lists them with their resolutions, like "Level-1 Products".
    relevant:
      - section: S1 Processing > L1 Algorithms > Single Look Complex (SLC)
        url: https://sentiwiki.copernicus.eu/web/s1-processing#Single-Look-Complex-(SLC)
      - section: S1 Processing > L1 Algorithms > Ground Range Detected (GRD)
        url: https://sentiwiki.copernicus.eu/web/s1-processing#Ground-Range-Detected-(GRD)
      - section: Sentinel-1 Product Definition > 5 LEVEL 1 PRODUCTS OVERVIEW > 5.2 Product Type Descriptions
        url: https://sentiwiki.copernicus.eu/__attachments/a_9d556abaa46ab095ed4dec0ca13798281182401682fd3c3c87e70ffe942774ad/S1-RS-MDA-52-7440-Sentinel-1-Product-Definition-2.11.pdf#page=36
      - section: Sentinel-1 Product Definition > 5 LEVEL 1 PRODUCTS OVERVIEW > 5.2 Product Type Descriptions > 5.2.1 Slant Range, Single-Look, Complex Products (SLC)
        url: https://sentiwiki.copernicus.eu/__attachments/a_9d556abaa46ab095ed4dec0ca13798281182401682fd3c3c87e70ffe942774ad/S1-RS-MDA-52-7440-Sentinel-1-Product-Definition-2.11.pdf#page=37
