[project]
name = "sentinel1-rag"
version = "0.1.0"
description = "Local RAG over the Sentinel-1 SentiWiki documentation (Ollama + Postgres/pgvector)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
